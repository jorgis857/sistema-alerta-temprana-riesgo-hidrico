# /etc/mosquitto/conf.d/wrews.conf  -  broker del gateway WREWS
# Escucha en toda la red local (el ESP32 se conecta por Wi-Fi) y exige
# usuario y clave: sin cuenta no se puede publicar ni leer nada.
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/wrews.passwd
acl_file /etc/mosquitto/wrews.acl

# La persistencia (para que los mensajes retenidos sobrevivan a un reinicio)
# y el log en /var/log/mosquitto/mosquitto.log ya vienen activados en
# /etc/mosquitto/mosquitto.conf de Raspberry Pi OS.
